services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shipments}
      POSTGRES_USER: ${POSTGRES_USER:-shipment_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shipment_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shipment_user} -d ${POSTGRES_DB:-shipments}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      # "db" is the Compose service name; containers reach each other by service name
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-shipments}
      DB_USER: ${POSTGRES_USER:-shipment_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-shipment_pass}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      args:
        # URL the BROWSER uses to reach the API (baked in at build time)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
