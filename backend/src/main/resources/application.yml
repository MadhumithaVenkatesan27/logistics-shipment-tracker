spring:
  application:
    name: shipment-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shipments}
    username: ${DB_USER:shipment_user}
    password: ${DB_PASSWORD:shipment_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # schema is owned by Flyway migrations
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  timezone: ${APP_TIMEZONE:UTC}   # zone used for the "expected delivery date not before creation date" rule
